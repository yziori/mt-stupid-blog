pre-commit:
  parallel: true
  commands:
    oxlint:
      glob: "src/**/*.{ts,tsx,js,jsx}"
      run: pnpm oxlint {staged_files}
    oxfmt:
      glob: "src/**/*.{ts,tsx,js,jsx}"
      run: pnpm oxfmt --check {staged_files}
    astro-check:
      glob: "src/**/*.{astro,ts,tsx}"
      run: pnpm astro check
